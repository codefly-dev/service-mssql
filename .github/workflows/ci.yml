name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: codefly-dev/core/.github/workflows/go-service-ci.yml@main

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Runs the Kubernetes manifest-bundle conformance/boundary suite
      # (AssertKustomizeTemplates -> AssertKubernetesManifestContract), the
      # restricted-profile contract tests, and the Docker hardened-runtime test
      # that proves SQL Server serves under the restricted securityContext.
      # Docker is preinstalled on GitHub-hosted amd64 runners, where the
      # linux/amd64 SQL Server image runs natively. The heavy end-to-end
      # migration integration (TestCreateToRun) is exercised separately.
      # -v surfaces each conformance case and confirms the Docker hardened-runtime
      # test actually runs (rather than silently skipping) on the amd64 runner.
      - name: Conformance and hardened-runtime tests
        run: |
          go test ./... -v -skip '^TestCreateToRun$'
